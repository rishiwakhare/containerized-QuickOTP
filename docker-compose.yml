version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: quickotp-frontend
    ports:
      - "8080:80"
    networks:
      - monitoring

  backend:
    build: ./backend
    container_name: quickotp-backend
    ports:
      - "3000:3000"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
